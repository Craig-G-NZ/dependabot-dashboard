<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <script src="/js/theme-init.js"></script>
  <title>Alerts</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/app.css?v=5">
</head>
<body>
  <div class="app-shell app-shell--wide">
    <div class="app-shell__accent" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header__top">
        <a class="site-brand" href="#/">
          <div class="site-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 5l9 4v7c0 6.2-4 10.4-9 12-5-1.6-9-5.8-9-12V9l9-4z" stroke="#ea580c" stroke-width="2" fill="#0f172a"/>
              <path d="M12.5 16.2l2.4 2.4 4.8-5.2" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="site-brand__text">
            <p class="site-eyebrow">GitHub security</p>
            <h1 class="site-title">Alerts</h1>
          </div>
        </a>
        <div class="site-header__actions">
          <button type="button" id="theme-toggle" class="btn btn-icon theme-toggle" aria-label="Switch theme" title="Theme">
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round"/>
            </svg>
          </button>
          <span id="user-label" class="site-header__user hidden"></span>
          <button type="button" id="btn-refresh" class="btn btn-ghost hidden">Refresh</button>
          <button type="button" id="login-btn" class="btn btn-primary">Connect GitHub</button>
          <button type="button" id="btn-logout" class="btn btn-ghost hidden">Sign out</button>
        </div>
      </div>
    </header>

    <div id="app-error" class="alert-error hidden" role="alert"></div>

    <div id="app-layout" class="app-layout">
      <aside id="app-sidebar" class="app-sidebar">
        <div class="sidebar-header">
          <p class="text-caption" id="sidebar-title">Repositories</p>
          <button type="button" id="sidebar-toggle" class="btn btn-icon sidebar-toggle" aria-expanded="true" aria-controls="sidebar-body" aria-label="Collapse sidebar">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 4L6 8l4 4" />
            </svg>
          </button>
        </div>
        <div id="sidebar-body" class="sidebar-body sidebar-collapse-hidden">
          <div id="sidebar-content"></div>
        </div>
      </aside>
      <main id="main" class="app-main"></main>
    </div>
  </div>

  <script src="/js/bootstrap.js?v=5"></script>
</body>
</html>
